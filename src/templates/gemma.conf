# llama.cpp
model=unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
# mlx
# model=mlx-community/gemma-4-26B-A4B-it-qat-4bit

--temp 1.0

[mlx]
--max-tokens 8192
--prefill-step-size 2048

[mlx.serve]
--top-k 64
--min-p 0.0
--kv-bits 8
--prompt-cache-size 1

[llama.cpp]
--top-k 64
--min-p 0.0
--ctx-size 65536
--parallel 1
--cache-type-k q8_0
--cache-type-v q8_0
--n-predict 8192

## Uncomment for MTP drafting
# --spec-type draft-mtp
# --spec-draft-n-max 3

[llama.cpp.serve]
--cache-reuse 256
