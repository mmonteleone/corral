model=meta-models/Muse-Glimmer-30B-GGUF:Q4_K_M

--temp 1.0

[mlx]
--max-tokens 8192
--prefill-step-size 2048

[mlx.serve]
--top-k 64
--min-p 0.0
--kv-bits 8
--prompt-cache-size 1

[llama.cpp]
--top-k 64
--min-p 0.0
--ctx-size 65536
--parallel 1
--cache-type-k q8_0
--cache-type-v q8_0
--n-predict 8192

## Uncomment for DFlash drafting
# --spec-type draft-dflash
# --spec-draft-n-max 3

[llama.cpp.serve]
--cache-reuse 256
